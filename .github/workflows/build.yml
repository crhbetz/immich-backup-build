name: Immich Backup

on:
  workflow_dispatch:
  schedule:
    # Every day at 04:30 UTC
    - cron: "30 4 * * *"

permissions:
  contents: write

concurrency:
  group: immich-backup-release
  cancel-in-progress: false

env:
  UPSTREAM_REPO: immich-app/immich

jobs:
  check:
    name: Check latest Immich release
    runs-on: ubuntu-latest

    outputs:
      changed: ${{ steps.check.outputs.changed }}
      tag: ${{ steps.upstream.outputs.tag }}
      commit: ${{ steps.upstream.outputs.commit }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v7

      - name: Get latest stable Immich release
        id: upstream
        shell: bash
        run: |
          set -euo pipefail

          TAG="$(
            gh api \
              "repos/${UPSTREAM_REPO}/releases/latest" \
              --jq '.tag_name'
          )"

          if [[ -z "$TAG" ]]; then
            echo "Could not determine latest Immich release"
            exit 1
          fi

          COMMIT="$(
            git ls-remote \
              "https://github.com/${UPSTREAM_REPO}.git" \
              "refs/tags/${TAG}" |
            cut -f1
          )"

          if [[ -z "$COMMIT" ]]; then
            echo "Could not determine commit for ${TAG}"
            exit 1
          fi

          echo "Latest stable release: ${TAG}"
          echo "Commit: ${COMMIT}"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"

        env:
          GH_TOKEN: ${{ github.token }}

      - name: Read previously built release
        id: previous
        shell: bash
        run: |
          if [[ -f .upstream-release ]]; then
            echo "tag=$(cat .upstream-release)" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Check whether rebuild is required
        id: check
        shell: bash
        env:
          CURRENT: ${{ steps.upstream.outputs.tag }}
          PREVIOUS: ${{ steps.previous.outputs.tag }}
        run: |
          if [[ "$CURRENT" != "$PREVIOUS" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "New release detected: $CURRENT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already built: $CURRENT"
          fi

      - name: Checkout Immich release
        if: steps.check.outputs.changed == 'true'
        uses: actions/checkout@v7
        with:
          repository: immich-app/immich
          ref: ${{ steps.upstream.outputs.tag }}
          path: immich

      - name: Read Immich version
        if: steps.check.outputs.changed == 'true'
        id: version
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(
            sed -nE \
              's/^version:[[:space:]]*([^+]+).*/\1/p' \
              immich/mobile/pubspec.yaml |
            head -n1
          )"

          if [[ -z "$VERSION" ]]; then
            echo "Could not determine Immich version"
            exit 1
          fi

          echo "Immich version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    name: Build Immich Backup
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Immich release
        uses: actions/checkout@v7
        with:
          repository: immich-app/immich
          ref: ${{ needs.check.outputs.tag }}
          path: immich

      - name: Patch Android application ID and name
        working-directory: immich
        shell: bash
        run: |
          set -euo pipefail

          FILE="mobile/android/app/build.gradle"

          grep -q \
            'applicationId "app.alextran.immich"' \
            "$FILE"

          grep -q \
            'resValue "string", "app_name", "Immich"' \
            "$FILE"

          sed -i \
            's/applicationId "app\.alextran\.immich"/applicationId "app.alextran.immich.backup"/' \
            "$FILE"

          sed -i \
            's/resValue "string", "app_name", "Immich"/resValue "string", "app_name", "Immich Backup"/' \
            "$FILE"

          echo "Patched application:"
          grep -E \
            'applicationId|resValue "string", "app_name"' \
            "$FILE"

      - name: Setup Mise
        uses: immich-app/devtools/actions/use-mise@06a9ef925332c91be647d6256642b86b398592c8
        with:
          github_token: ${{ github.token }}
          working_directory: ./immich/mobile

      - name: Create signing keystore
        working-directory: immich/mobile
        env:
          KEY_JKS: ${{ secrets.KEY_JKS }}
        shell: bash
        run: |
          set -euo pipefail

          printf '%s' "$KEY_JKS" | base64 --decode > android/key.jks

          test -s android/key.jks

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"

      - name: Restore Gradle cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/sdk
            immich/mobile/android/.gradle
          key: immich-backup-gradle-${{ runner.os }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install dependencies
        working-directory: immich
        run: mise //mobile:install:ci

      - name: Generate code
        working-directory: immich
        run: mise //mobile:codegen

      - name: Build APK
        working-directory: immich/mobile
        env:
          ALIAS: ${{ secrets.ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail

          flutter build apk --release

      - name: Prepare release files
        env:
          VERSION: ${{ needs.check.outputs.version }}
          TAG: ${{ needs.check.outputs.tag }}
          COMMIT: ${{ needs.check.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release

          APK="immich/mobile/build/app/outputs/flutter-apk/app-release.apk"
          OUT="release/immich-backup-${VERSION}.apk"

          test -f "$APK"

          cp "$APK" "$OUT"

          sha256sum "$OUT" > "${OUT}.sha256"

          cat > release/build-info.txt <<EOF
          Immich Backup

          Immich release: ${TAG}
          Immich commit:  ${COMMIT}
          APK:            $(basename "$OUT")
          EOF

      - name: Verify APK
        env:
          VERSION: ${{ needs.check.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          APK="release/immich-backup-${VERSION}.apk"

          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"

          echo "=== Application ID ==="
          "$BUILD_TOOLS/apkanalyzer" \
            manifest application-id \
            "$APK"

          echo
          echo "=== Version ==="
          "$BUILD_TOOLS/apkanalyzer" \
            manifest version-name \
            "$APK"

          echo
          echo "=== Signing certificate ==="
          "$BUILD_TOOLS/apksigner" \
            verify \
            --print-certs \
            "$APK"

          echo
          echo "=== SHA256 ==="
          sha256sum "$APK"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
          TAG: ${{ needs.check.outputs.tag }}
          COMMIT: ${{ needs.check.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_TAG="immich-backup-${TAG}"

          gh release create "$RELEASE_TAG" \
            "release/immich-backup-${VERSION}.apk" \
            "release/immich-backup-${VERSION}.apk.sha256" \
            "release/build-info.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Immich Backup ${VERSION}" \
            --notes "$(cat <<EOF
          Immich Backup ${VERSION}

          Based on official Immich release: ${TAG}
          Upstream commit: ${COMMIT}

          Android application ID:
          app.alextran.immich.backup

          This is an automatically generated, separately signed build
          of the official Immich Android application.

          It can coexist with the normal Immich application.
          EOF
          )"

      - name: Record built release
        shell: bash
        env:
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          set -euo pipefail

          printf '%s\n' "$TAG" > .upstream-release

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add .upstream-release

          git commit \
            -m "Track Immich release ${TAG}"

          git push
