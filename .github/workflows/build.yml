name: Build Immich Backup

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  UPSTREAM_REPO: immich-app/immich

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check latest stable Immich release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG=$(gh api \
            "repos/${UPSTREAM_REPO}/releases/latest" \
            --jq '.tag_name')

          echo "Latest stable Immich release: ${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Check whether this version was already built
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists. Nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Release ${TAG} does not exist. Building."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout Immich
        if: steps.existing.outputs.exists != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: immich-app/immich
          ref: ${{ steps.upstream.outputs.tag }}
          path: immich
          persist-credentials: false

      - name: Patch Android application ID and app name
        if: steps.existing.outputs.exists != 'true'
        working-directory: immich
        shell: bash
        run: |
          set -euo pipefail

          GRADLE_FILE="mobile/android/app/build.gradle"
          MANIFEST_FILE="mobile/android/app/src/main/AndroidManifest.xml"

          echo "Checking expected Immich source..."

          grep -q 'applicationId "app.alextran.immich"' "$GRADLE_FILE"
          grep -q 'android:label="Immich"' "$MANIFEST_FILE"

          echo "Patching application ID..."
          sed -i \
            's/applicationId "app\.alextran\.immich"/applicationId "app.alextran.immich.backup"/' \
            "$GRADLE_FILE"

          echo "Patching app name..."
          sed -i \
            's/android:label="Immich"/android:label="Immich Backup"/' \
            "$MANIFEST_FILE"

          echo "Result:"
          grep 'applicationId' "$GRADLE_FILE"
          grep 'android:label=' "$MANIFEST_FILE"

      - name: Setup Mise
        if: steps.existing.outputs.exists != 'true'
        uses: immich-app/devtools/actions/use-mise@06a9ef925332c91be647d6256642b86b398592c8 # use-mise-action-v3.2.1
        with:
          github_token: ${{ github.token }}
          working_directory: ./immich/mobile

      - name: Create Android keystore
        if: steps.existing.outputs.exists != 'true'
        env:
          KEY_JKS: ${{ secrets.KEY_JKS }}
        working-directory: ./immich/mobile
        run: |
          set -euo pipefail

          printf "%s" "$KEY_JKS" | base64 --decode > android/key.jks

          test -s android/key.jks

          echo "Keystore created:"
          ls -lh android/key.jks

      - name: Setup Java
        if: steps.existing.outputs.exists != 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: zulu
          java-version: "17"

      - name: Setup Android SDK
        if: steps.existing.outputs.exists != 'true'
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: ""

      - name: Install dependencies
        if: steps.existing.outputs.exists != 'true'
        working-directory: ./immich
        run: mise //mobile:install:ci

      - name: Run code generation
        if: steps.existing.outputs.exists != 'true'
        working-directory: ./immich
        run: mise //mobile:codegen

      - name: Build APK
        if: steps.existing.outputs.exists != 'true'
        working-directory: ./immich/mobile
        env:
          ALIAS: ${{ secrets.ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail

          mkdir -p ~/.gradle
          echo 'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g' >> ~/.gradle/gradle.properties

          flutter build apk --release

          APK="build/app/outputs/flutter-apk/app-release.apk"

          test -s "$APK"

          VERSION="${{ steps.upstream.outputs.tag }}"
          VERSION="${VERSION#v}"

          cp "$APK" "immich-backup-${VERSION}.apk"

          sha256sum "immich-backup-${VERSION}.apk" \
            > "immich-backup-${VERSION}.apk.sha256"

      - name: Verify APK
        if: steps.existing.outputs.exists != 'true'
        working-directory: ./immich/mobile
        run: |
          set -euo pipefail

          VERSION="${{ steps.upstream.outputs.tag }}"
          VERSION="${VERSION#v}"

          APK="immich-backup-${VERSION}.apk"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -name apksigner \
            -type f \
            | sort -V \
            | tail -n1)

          APKANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"

          echo "APK: $APK"
          echo "APK signer: $APKSIGNER"
          echo "APK analyzer: $APKANALYZER"

          echo
          echo "Package:"
          "$APKANALYZER" manifest application-id "$APK"

          echo
          echo "Version:"
          "$APKANALYZER" manifest version-name "$APK"
          "$APKANALYZER" manifest version-code "$APK"

          echo
          echo "Signing certificate:"
          "$APKSIGNER" verify --print-certs "$APK"

          echo
          echo "Expected package:"
          echo "app.alextran.immich.backup"

          ACTUAL_PACKAGE=$("$APKANALYZER" manifest application-id "$APK")

          test "$ACTUAL_PACKAGE" = "app.alextran.immich.backup"

      - name: Create build info
        if: steps.existing.outputs.exists != 'true'
        working-directory: ./immich/mobile
        run: |
          set -euo pipefail

          VERSION="${{ steps.upstream.outputs.tag }}"
          VERSION="${VERSION#v}"

          cat > "immich-backup-${VERSION}.build-info.txt" <<EOF
          Upstream repository: https://github.com/immich-app/immich
          Upstream release: ${{ steps.upstream.outputs.tag }}
          Upstream commit: $(git -C .. rev-parse HEAD)
          Application ID: app.alextran.immich.backup
          App name: Immich Backup
          Build date: $(date -u +"%Y-%m-%dT%H:%M:%SZ")
          EOF

      - name: Create GitHub Release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.upstream.outputs.tag }}
        working-directory: ./immich/mobile
        run: |
          set -euo pipefail

          VERSION="${TAG#v}"
          APK="immich-backup-${VERSION}.apk"
          CHECKSUM="${APK}.sha256"
          BUILD_INFO="immich-backup-${VERSION}.build-info.txt"

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Immich Backup $TAG" \
            --notes "Immich Backup build based on upstream Immich ${TAG}." \
            "$APK" \
            "$CHECKSUM" \
            "$BUILD_INFO"

